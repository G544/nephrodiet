[project]
name = "nephrodiet"
version = "0.1.0"
description = "Nephro diet weekly menu generator"
authors = [
    {name = "pozhidaevak",email = "pozhidaevak@gmail.com"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "sqlmodel (>=0.0.42,<0.0.43)",
    "alembic (>=1.20.0,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "langchain-google-genai (>=4.4.0,<5.0.0)",
    "langchain-core (>=1.6.3,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "rapidfuzz (>=3.14.6,<4.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "streamlit (>=1.50,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.8,<0.17.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
